<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1230" viewBox="0 0 1200 1230"><rect width="1200" height="1230" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><g font-family="Arial, sans-serif"><text x="600.0" y="57.0" text-anchor="middle" font-size="32" fill="#334155">User validation workflow</text><text x="600.0" y="108.0" text-anchor="middle" font-size="18" fill="#64748b">SETUP · define once, reuse for every request</text><rect x="50" y="145" width="290" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="195.0" y="190.0" text-anchor="middle" font-size="20" fill="#334155">Schema</text><text x="195.0" y="215.0" text-anchor="middle" font-size="20" fill="#334155">name, email, password rules</text><rect x="455" y="145" width="290" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="600.0" y="190.0" text-anchor="middle" font-size="20" fill="#334155">Compiled validator</text><text x="600.0" y="215.0" text-anchor="middle" font-size="20" fill="#334155">vine.compile(schema)</text><rect x="860" y="145" width="290" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="1005.0" y="190.0" text-anchor="middle" font-size="20" fill="#334155">Message provider</text><text x="1005.0" y="215.0" text-anchor="middle" font-size="20" fill="#334155">Custom field / rule messages</text><path d="M340,195 L455,195" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="390" y="300" width="420" height="85" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="600.0" y="337.5" text-anchor="middle" font-size="20" fill="#334155">Attach to POST /users</text><text x="600.0" y="362.5" text-anchor="middle" font-size="20" fill="#334155">validate(validator, messageProvider)</text><path d="M600,245 L600,300" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1005,245 L810,330" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="600.0" y="443.0" text-anchor="middle" font-size="18" fill="#64748b">REQUEST · middleware runs before the controller</text><rect x="50" y="485" width="280" height="85" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="190.0" y="522.5" text-anchor="middle" font-size="20" fill="#334155">POST /users</text><text x="190.0" y="547.5" text-anchor="middle" font-size="20" fill="#334155">JSON request body</text><rect x="460" y="485" width="280" height="85" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="600.0" y="522.5" text-anchor="middle" font-size="20" fill="#334155">express.json()</text><text x="600.0" y="547.5" text-anchor="middle" font-size="20" fill="#334155">Parses JSON into req.body</text><path d="M330,527 L460,527" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="460" y="635" width="280" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="600.0" y="667.5" text-anchor="middle" font-size="20" fill="#334155">Validation middleware</text><text x="600.0" y="692.5" text-anchor="middle" font-size="20" fill="#334155">await validator.validate(</text><text x="600.0" y="717.5" text-anchor="middle" font-size="20" fill="#334155">req.body, { messagesProvider })</text><path d="M600,570 L600,635" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="945.0" y="673.0" text-anchor="middle" font-size="18" fill="#64748b">Checks rules and applies</text><text x="945.0" y="695.5" text-anchor="middle" font-size="18" fill="#64748b">configured transformations</text><rect x="140" y="820" width="340" height="100" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="310.0" y="852.5" text-anchor="middle" font-size="20" fill="#334155">PASS</text><text x="310.0" y="877.5" text-anchor="middle" font-size="20" fill="#334155">res.locals.validatedData = output</text><text x="310.0" y="902.5" text-anchor="middle" font-size="20" fill="#334155">next()</text><rect x="730" y="820" width="340" height="100" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/><text x="900.0" y="852.5" text-anchor="middle" font-size="20" fill="#334155">FAIL</text><text x="900.0" y="877.5" text-anchor="middle" font-size="20" fill="#334155">Vine throws E_VALIDATION_ERROR</text><text x="900.0" y="902.5" text-anchor="middle" font-size="20" fill="#334155">Express 5 forwards the error</text><path d="M520,735 L310,820" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M680,735 L900,820" stroke="#e11d48" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="140" y="985" width="340" height="100" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="310.0" y="1017.5" text-anchor="middle" font-size="20" fill="#334155">createUser controller</text><text x="310.0" y="1042.5" text-anchor="middle" font-size="20" fill="#334155">Reads validatedData</text><text x="310.0" y="1067.5" text-anchor="middle" font-size="20" fill="#334155">Hashes password → inserts user</text><rect x="730" y="985" width="340" height="100" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/><text x="900.0" y="1017.5" text-anchor="middle" font-size="20" fill="#334155">Error handler</text><text x="900.0" y="1042.5" text-anchor="middle" font-size="20" fill="#334155">HTTP 422 + err.messages</text><text x="900.0" y="1067.5" text-anchor="middle" font-size="20" fill="#334155">Controller is skipped</text><path d="M310,920 L310,985" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M900,920 L900,985" stroke="#e11d48" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="600.0" y="1159.0" text-anchor="middle" font-size="19" fill="#64748b">Message provider changes wording, not validation rules.</text><text x="600.0" y="1182.75" text-anchor="middle" font-size="19" fill="#64748b">Example: &quot;name.required&quot; → &quot;Please enter a name&quot;</text></g></svg>