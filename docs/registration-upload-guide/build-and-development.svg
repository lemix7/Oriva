<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="760" viewBox="0 0 1450 760" role="img" aria-label="Which code is your server actually running?">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#52667b"/></marker></defs>
<rect width="1450" height="760" fill="#ffffff"/>
<text x="40" y="62.0" font-family="Arial,sans-serif" font-size="32" fill="#25364a">Which code is your server actually running?</text>
<text x="40" y="101.0" font-family="Arial,sans-serif" font-size="19" fill="#52667b">Two ways to run the same TypeScript application.</text>
<text x="40" y="166.0" font-family="Arial,sans-serif" font-size="21" fill="#25364a">Compiled workflow</text>
<rect x="40" y="190" width="310" height="165" rx="12" fill="#e7f5ff" stroke="#25364a" stroke-width="1.5"/>
<text x="56" y="229.0" font-family="Arial,sans-serif" font-size="22" fill="#25364a">Edit source</text>
<text x="56" y="268.0" font-family="Arial,sans-serif" font-size="18" fill="#25364a">src/apis.ts</text>
<text x="56" y="292.3" font-family="Arial,sans-serif" font-size="18" fill="#25364a">TypeScript source</text>
<path d="M355 270 l30 0" stroke="#52667b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="390" y="190" width="310" height="165" rx="12" fill="#e7f5ff" stroke="#25364a" stroke-width="1.5"/>
<text x="406" y="229.0" font-family="Arial,sans-serif" font-size="22" fill="#25364a">npm run build</text>
<text x="406" y="268.0" font-family="Arial,sans-serif" font-size="18" fill="#25364a">Runs tsc</text>
<text x="406" y="292.3" font-family="Arial,sans-serif" font-size="18" fill="#25364a">Checks + converts code</text>
<path d="M705 270 l30 0" stroke="#52667b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="740" y="190" width="310" height="165" rx="12" fill="#fff3bf" stroke="#25364a" stroke-width="1.5"/>
<text x="756" y="229.0" font-family="Arial,sans-serif" font-size="22" fill="#25364a">Build output</text>
<text x="756" y="268.0" font-family="Arial,sans-serif" font-size="18" fill="#25364a">dist/apis.js</text>
<text x="756" y="292.3" font-family="Arial,sans-serif" font-size="18" fill="#25364a">Generated JavaScript</text>
<path d="M1055 270 l30 0" stroke="#52667b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1090" y="190" width="310" height="165" rx="12" fill="#d3f9d8" stroke="#25364a" stroke-width="1.5"/>
<text x="1106" y="229.0" font-family="Arial,sans-serif" font-size="22" fill="#25364a">npm start</text>
<text x="1106" y="268.0" font-family="Arial,sans-serif" font-size="18" fill="#25364a">Runs node dist/apis.js</text>
<text x="1106" y="292.3" font-family="Arial,sans-serif" font-size="18" fill="#25364a">Starts the server</text>
<text x="40" y="393.0" font-family="Arial,sans-serif" font-size="18" fill="#52667b">After an edit: stop the old server, rebuild, then start again. npm start does not rebuild.</text>
<text x="40" y="466.0" font-family="Arial,sans-serif" font-size="21" fill="#25364a">Development workflow</text>
<rect x="40" y="490" width="310" height="165" rx="12" fill="#e7f5ff" stroke="#25364a" stroke-width="1.5"/>
<text x="56" y="529.0" font-family="Arial,sans-serif" font-size="22" fill="#25364a">npm run dev</text>
<text x="56" y="568.0" font-family="Arial,sans-serif" font-size="18" fill="#25364a">Runs tsx watch</text>
<text x="56" y="592.3" font-family="Arial,sans-serif" font-size="18" fill="#25364a">Entry: src/apis.ts</text>
<path d="M355 570 l30 0" stroke="#52667b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="390" y="490" width="310" height="165" rx="12" fill="#e7f5ff" stroke="#25364a" stroke-width="1.5"/>
<text x="406" y="529.0" font-family="Arial,sans-serif" font-size="22" fill="#25364a">Edit and save</text>
<text x="406" y="568.0" font-family="Arial,sans-serif" font-size="18" fill="#25364a">Change TypeScript</text>
<text x="406" y="592.3" font-family="Arial,sans-serif" font-size="18" fill="#25364a">No manual build needed</text>
<path d="M705 570 l30 0" stroke="#52667b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="740" y="490" width="310" height="165" rx="12" fill="#d3f9d8" stroke="#25364a" stroke-width="1.5"/>
<text x="756" y="529.0" font-family="Arial,sans-serif" font-size="22" fill="#25364a">Automatic restart</text>
<text x="756" y="568.0" font-family="Arial,sans-serif" font-size="18" fill="#25364a">tsx reruns the server</text>
<text x="756" y="592.3" font-family="Arial,sans-serif" font-size="18" fill="#25364a">Uses changed source</text>
<path d="M1055 570 l30 0" stroke="#52667b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1090" y="490" width="310" height="165" rx="12" fill="#fff3bf" stroke="#25364a" stroke-width="1.5"/>
<text x="1106" y="529.0" font-family="Arial,sans-serif" font-size="22" fill="#25364a">Check types separately</text>
<text x="1106" y="568.0" font-family="Arial,sans-serif" font-size="18" fill="#25364a">npx tsc --noEmit</text>
<text x="1106" y="592.3" font-family="Arial,sans-serif" font-size="18" fill="#25364a">Reports TypeScript errors</text>
<text x="40" y="693.0" font-family="Arial,sans-serif" font-size="18" fill="#52667b">tsx runs TypeScript but does not type-check it. Build output is still used by npm start.</text>
</svg>