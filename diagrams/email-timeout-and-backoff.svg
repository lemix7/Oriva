<svg xmlns="http://www.w3.org/2000/svg" width="1490" height="1480" viewBox="0 0 1490 1480"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#2563a6" stroke-width="1.5"/></marker></defs><rect width="1490" height="1480" fill="white"/><text x="50" y="64.0" font-family="Arial,sans-serif" font-size="36" fill="#24364b">Email retries: timeout + exponential backoff</text><text x="50" y="103.0" font-family="Arial,sans-serif" font-size="21" fill="#596b7d">Current email.service.ts  |  One initial request + four retries  |  Stops as soon as a request succeeds</text><rect x="50" y="140" width="1390" height="300" rx="14" fill="#edf5ff" stroke="#2563a6" stroke-width="2"/><text x="78" y="187.0" font-family="Arial,sans-serif" font-size="27" fill="#2563a6">1  TIMEOUT: limit each individual attempt</text><rect x="78" y="220" width="350" height="155" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="100" y="261.0" font-family="Arial,sans-serif" font-size="23" fill="#24364b">Create a fresh signal</text><text x="100" y="299.0" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">AbortSignal.timeout(5000)</text><text x="100" y="323.7" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">starts a new 5-second timer.</text><rect x="498" y="220" width="350" height="155" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="520" y="261.0" font-family="Arial,sans-serif" font-size="23" fill="#24364b">Start the request</text><text x="520" y="299.0" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Send the same email payload</text><text x="520" y="323.7" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">and idempotency key.</text><text x="520" y="348.4" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Pass the new signal to Resend.</text><rect x="918" y="220" width="490" height="155" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="940" y="261.0" font-family="Arial,sans-serif" font-size="23" fill="#24364b">Wait for the outcome</text><text x="940" y="299.0" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Response arrives first: inspect the result.</text><text x="940" y="323.7" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Still pending at 5 seconds: abort request.</text><text x="940" y="348.4" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">A timeout can then qualify for a retry.</text><path d="M428,290 l70,0" fill="none" stroke="#2563a6" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M848,290 l70,0" fill="none" stroke="#2563a6" stroke-width="2.5" marker-end="url(#arrow)"/><text x="78" y="420.0" font-family="Arial,sans-serif" font-size="22" fill="#2563a6">An aborted signal stays aborted. Never reuse it for the next attempt.</text><text x="50" y="515.0" font-family="Arial,sans-serif" font-size="29" fill="#24364b">2  BACKOFF: wait between failed attempts</text><text x="50" y="553.0" font-family="Arial,sans-serif" font-size="20" fill="#596b7d">Example: every attempt times out. These are nominal timings, excluding scheduling overhead.</text><rect x="50" y="590" width="230" height="155" rx="14" fill="#ffffff" stroke="#2563a6" stroke-width="2"/><text x="72" y="631.0" font-family="Arial,sans-serif" font-size="23" fill="#24364b">Attempt 1</text><text x="72" y="669.0" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Initial request</text><text x="72" y="693.7" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Fresh 5-second signal</text><text x="72" y="718.4" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Send, then await result</text><path d="M280,665 l60,0" fill="none" stroke="#2563a6" stroke-width="2.5" marker-end="url(#arrow)"/><text x="276" y="778.0" font-family="Arial,sans-serif" font-size="16" fill="#2563a6">Wait 1s</text><rect x="340" y="590" width="230" height="155" rx="14" fill="#ffffff" stroke="#2563a6" stroke-width="2"/><text x="362" y="631.0" font-family="Arial,sans-serif" font-size="23" fill="#24364b">Attempt 2</text><text x="362" y="669.0" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Retry 1</text><text x="362" y="693.7" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Fresh 5-second signal</text><text x="362" y="718.4" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Send, then await result</text><path d="M570,665 l60,0" fill="none" stroke="#2563a6" stroke-width="2.5" marker-end="url(#arrow)"/><text x="566" y="778.0" font-family="Arial,sans-serif" font-size="16" fill="#2563a6">Wait 2s</text><rect x="630" y="590" width="230" height="155" rx="14" fill="#ffffff" stroke="#2563a6" stroke-width="2"/><text x="652" y="631.0" font-family="Arial,sans-serif" font-size="23" fill="#24364b">Attempt 3</text><text x="652" y="669.0" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Retry 2</text><text x="652" y="693.7" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Fresh 5-second signal</text><text x="652" y="718.4" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Send, then await result</text><path d="M860,665 l60,0" fill="none" stroke="#2563a6" stroke-width="2.5" marker-end="url(#arrow)"/><text x="856" y="778.0" font-family="Arial,sans-serif" font-size="16" fill="#2563a6">Wait 4s</text><rect x="920" y="590" width="230" height="155" rx="14" fill="#ffffff" stroke="#2563a6" stroke-width="2"/><text x="942" y="631.0" font-family="Arial,sans-serif" font-size="23" fill="#24364b">Attempt 4</text><text x="942" y="669.0" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Retry 3</text><text x="942" y="693.7" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Fresh 5-second signal</text><text x="942" y="718.4" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Send, then await result</text><path d="M1150,665 l60,0" fill="none" stroke="#2563a6" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1146" y="778.0" font-family="Arial,sans-serif" font-size="16" fill="#2563a6">Wait 8s</text><rect x="1210" y="590" width="230" height="155" rx="14" fill="#ffffff" stroke="#2563a6" stroke-width="2"/><text x="1232" y="631.0" font-family="Arial,sans-serif" font-size="23" fill="#24364b">Attempt 5</text><text x="1232" y="669.0" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Retry 4</text><text x="1232" y="693.7" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Fresh 5-second signal</text><text x="1232" y="718.4" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Send, then await result</text><text x="75" y="818.0" font-family="Arial,sans-serif" font-size="18" fill="#596b7d">0–5s: request</text><text x="365" y="818.0" font-family="Arial,sans-serif" font-size="18" fill="#596b7d">6–11s: request</text><text x="655" y="818.0" font-family="Arial,sans-serif" font-size="18" fill="#596b7d">13–18s: request</text><text x="945" y="818.0" font-family="Arial,sans-serif" font-size="18" fill="#596b7d">22–27s: request</text><text x="1235" y="818.0" font-family="Arial,sans-serif" font-size="18" fill="#596b7d">35–40s: request</text><text x="50" y="879.0" font-family="Arial,sans-serif" font-size="21" fill="#24364b">Normal retry delays: 1s → 2s → 4s → 8s. No delay before attempt 1 or after the final failure.</text><text x="50" y="916.0" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Formula: wait_time = 1000 × 2 ** attempt     (attempt is the zero-based loop counter: 0, 1, 2, 3)</text><rect x="50" y="960" width="675" height="340" rx="14" fill="#f6f8fb" stroke="#cbd5e1" stroke-width="2"/><text x="78" y="1009.0" font-family="Arial,sans-serif" font-size="26" fill="#24364b">3  Decide whether to continue</text><text x="78" y="1054.0" font-family="Arial,sans-serif" font-size="20" fill="#24364b">SUCCESS → return data immediately; no more sends.</text><text x="78" y="1100.0" font-family="Arial,sans-serif" font-size="20" fill="#24364b">TEMPORARY FAILURE → wait, then start a new attempt.</text><text x="78" y="1131.0" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Timeout/network error, HTTP 429, or server error (5xx).</text><text x="78" y="1178.0" font-family="Arial,sans-serif" font-size="20" fill="#24364b">PERMANENT FAILURE / LAST ATTEMPT → return null.</text><text x="78" y="1219.0" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">An unexpected thrown error is caught and returns null.</text><text x="78" y="1262.0" font-family="Arial,sans-serif" font-size="20" fill="#24364b">Registration continues after the service returns.</text><rect x="755" y="960" width="685" height="340" rx="14" fill="#fff8e8" stroke="#d4ad57" stroke-width="2"/><text x="783" y="1009.0" font-family="Arial,sans-serif" font-size="26" fill="#24364b">What each mechanism actually does</text><text x="783" y="1054.0" font-family="Arial,sans-serif" font-size="20" fill="#24364b">Abort limits the current request. Backoff delays the next.</text><text x="783" y="1100.0" font-family="Arial,sans-serif" font-size="20" fill="#24364b">Neither one pauses an HTTP request and resumes it later.</text><text x="783" y="1146.0" font-family="Arial,sans-serif" font-size="20" fill="#24364b">An abort does not undo an email already accepted.</text><text x="783" y="1176.0" font-family="Arial,sans-serif" font-size="18" fill="#596b7d">Reuse one idempotency key + identical payload across retries.</text><text x="783" y="1220.0" font-family="Arial,sans-serif" font-size="20" fill="#24364b">With five timeouts: 25s requesting + 15s waiting ≈ 40s.</text><text x="783" y="1261.0" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Your controller waits for this service before responding.</text><text x="50" y="1355.0" font-family="Arial,sans-serif" font-size="20" fill="#596b7d">Current settings: base delay 1s • max retries 4 • timeout 5s per request • wait cap 30s</text><text x="50" y="1392.0" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">The 30s cap is never reached by 1 / 2 / 4 / 8s waits. This version does not read the Retry-After header.</text><text x="50" y="1437.0" font-family="Arial,sans-serif" font-size="17" fill="#596b7d">Based on src/services/email.service.ts • 17 October 2026 • Proposed timing is illustrative, not a live send.</text></svg>