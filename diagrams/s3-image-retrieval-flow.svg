<svg xmlns="http://www.w3.org/2000/svg" width="1490" height="1470" viewBox="0 0 1490 1470"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#2563a6" stroke-width="1.5"/></marker></defs><rect width="1490" height="1470" fill="white"/><text x="50" y="64.0" font-family="Arial,sans-serif" font-size="36" fill="#24364b">Retrieve a profile image from private S3</text><text x="50" y="103.0" font-family="Arial,sans-serif" font-size="21" fill="#596b7d">Proposed flow for this Express app  |  The saved image key becomes a temporary viewing link</text><rect x="50" y="140" width="360" height="160" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="72" y="181.0" font-family="Arial,sans-serif" font-size="23" fill="#24364b">1  Browser requests profile</text><text x="72" y="219.0" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Send a request to the</text><text x="72" y="243.7" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Express API for a user.</text><rect x="490" y="140" width="460" height="160" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="512" y="181.0" font-family="Arial,sans-serif" font-size="23" fill="#24364b">2  Backend checks access</text><text x="512" y="219.0" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Authorize the requester, then</text><text x="512" y="243.7" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">load the user and profile_pic_key.</text><rect x="1030" y="140" width="410" height="160" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1052" y="181.0" font-family="Arial,sans-serif" font-size="23" fill="#24364b">3  Database returns the key</text><text x="1052" y="219.0" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">profile_pic_key:</text><text x="1052" y="243.7" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">uploads/abc-photo.jpg</text><path d="M410,220 l80,0" fill="none" stroke="#2563a6" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M950,220 l80,0" fill="none" stroke="#2563a6" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1235,300 l0,90" fill="none" stroke="#2563a6" stroke-width="2.5" marker-end="url(#arrow)"/><text x="950" y="348.0" font-family="Arial,sans-serif" font-size="18" fill="#596b7d">Key + bucket identify one image</text><rect x="50" y="390" width="1390" height="520" rx="14" fill="#edf5ff" stroke="#2563a6" stroke-width="2"/><text x="78" y="442.0" font-family="Arial,sans-serif" font-size="30" fill="#2563a6">FOCUS  /  Backend generates the temporary link</text><text x="78" y="479.0" font-family="Arial,sans-serif" font-size="21" fill="#24364b">Signing happens in the backend with the AWS SDK; the image stays in S3.</text><rect x="78" y="515" width="390" height="225" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="100" y="556.0" font-family="Arial,sans-serif" font-size="23" fill="#24364b">A  Describe the read request</text><text x="100" y="594.0" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Operation: GetObject (read)</text><text x="100" y="618.7" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Bucket: AWS_BUCKET_NAME</text><text x="100" y="643.4" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Key: saved profile_pic_key</text><text x="100" y="668.1" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Lifetime: 900 seconds (15 min)</text><rect x="528" y="515" width="390" height="225" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="550" y="556.0" font-family="Arial,sans-serif" font-size="23" fill="#24364b">B  Sign with AWS credentials</text><text x="550" y="594.0" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">The SDK uses the backend</text><text x="550" y="618.7" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">identity’s credentials to sign</text><text x="550" y="643.4" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">the request and its expiration.</text><text x="550" y="668.1" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">The secret key stays on server.</text><rect x="978" y="515" width="432" height="225" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1000" y="556.0" font-family="Arial,sans-serif" font-size="23" fill="#24364b">C  Produce a presigned URL</text><text x="1000" y="594.0" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">An image address containing</text><text x="1000" y="618.7" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">signing details, expiration</text><text x="1000" y="643.4" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">and a cryptographic signature.</text><text x="1000" y="668.1" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Return it as profile_pic_url.</text><path d="M468,625 l60,0" fill="none" stroke="#2563a6" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M918,625 l60,0" fill="none" stroke="#2563a6" stroke-width="2.5" marker-end="url(#arrow)"/><text x="80" y="791.0" font-family="Arial,sans-serif" font-size="21" fill="#2563a6">No image download occurs during signing. Generating a URL does not prove access will succeed.</text><text x="80" y="832.0" font-family="Arial,sans-serif" font-size="20" fill="#24364b">The signing identity needs s3:GetObject permission for this image; upload permission alone is insufficient.</text><text x="80" y="870.0" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">AWS SDK tools for implementation: GetObjectCommand + getSignedUrl   •   No secret key appears in the URL.</text><path d="M1190,910 l0,75" fill="none" stroke="#2563a6" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="978" y="985" width="432" height="190" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1000" y="1026.0" font-family="Arial,sans-serif" font-size="23" fill="#24364b">4  Browser receives the URL</text><text x="1000" y="1064.0" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Use profile_pic_url as the</text><text x="1000" y="1088.7" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">image source. The browser</text><text x="1000" y="1113.4" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">requests the image from S3.</text><rect x="528" y="985" width="390" height="190" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="550" y="1026.0" font-family="Arial,sans-serif" font-size="23" fill="#24364b">5  S3 checks the request</text><text x="550" y="1064.0" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Verify signature, expiration</text><text x="550" y="1088.7" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">and effective read permissions.</text><text x="550" y="1113.4" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">If allowed, return image bytes.</text><rect x="78" y="985" width="390" height="190" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="100" y="1026.0" font-family="Arial,sans-serif" font-size="23" fill="#24364b">6  Browser displays image</text><text x="100" y="1064.0" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">Image bytes travel directly</text><text x="100" y="1088.7" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">from S3 to the browser.</text><text x="100" y="1113.4" font-family="Arial,sans-serif" font-size="19" fill="#596b7d">The bucket remains private.</text><path d="M978,1080 l-60,0" fill="none" stroke="#2563a6" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M528,1080 l-60,0" fill="none" stroke="#2563a6" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="1220" width="1390" height="160" rx="14" fill="#fff8e8" stroke="#d4ad57" stroke-width="2"/><text x="78" y="1265.0" font-family="Arial,sans-serif" font-size="25" fill="#24364b">Temporary access, permanent image</text><text x="78" y="1302.0" font-family="Arial,sans-serif" font-size="20" fill="#24364b">Anyone holding the URL can use it while valid. After expiry, ask the backend for a fresh link.</text><text x="78" y="1335.0" font-family="Arial,sans-serif" font-size="20" fill="#24364b">Keep the key in the database, not the temporary URL. Expiry does not delete the image or erase a loaded copy.</text><text x="78" y="1366.0" font-family="Arial,sans-serif" font-size="18" fill="#596b7d">Credentials or policy restrictions can end access earlier. No saved key? Show a default avatar.</text><text x="50" y="1427.0" font-family="Arial,sans-serif" font-size="17" fill="#596b7d">Reference: AWS S3 User Guide — Download and upload objects with presigned URLs</text></svg>